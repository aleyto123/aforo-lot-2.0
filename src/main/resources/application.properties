spring.application.name=aforo

# Puerto del servidor
server.port=8080

# Configuración de base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:aforodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Habilitar consola de H2 para depuración
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Hibernate ddl-auto
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuracion del Arduino Uno conectado por USB.
# Si el puerto no existe o esta ocupado, la aplicacion seguira funcionando con el simulador web.
arduino.port=COM3
arduino.business-id=1
